<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS 6.1</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171717;color:#ececec;display:flex;height:100dvh}aside{width:260px;background:#101010;padding:18px 12px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #303030}button{cursor:pointer;font:inherit;color:inherit}#new{border:1px solid #414141;border-radius:10px;background:#222;padding:12px;text-align:left}#new:hover,.chat:hover{background:#292929}#history{overflow:auto;flex:1}.chat{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:9px;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat.active{background:#303030}main{flex:1;min-width:0;display:flex;flex-direction:column}.top{padding:18px 25px;border-bottom:1px solid #2c2c2c;font-weight:650}#messages{width:100%;max-width:850px;margin:auto;overflow-y:auto;flex:1;padding:26px 24px 40px;display:flex;flex-direction:column;gap:24px}.message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.message.user{align-self:flex-end;max-width:85%;background:#303030;padding:12px 18px;border-radius:18px}.message.assistant{align-self:stretch}.label{font-weight:700;margin-bottom:7px;color:#c5d8ff}.welcome{text-align:center;margin:auto;color:#d8d8d8;font-size:27px;font-weight:650}.composer{width:min(850px,100%);padding:10px 22px 20px;margin:0 auto}#attach{background:#454545;border:0;border-radius:10px;padding:10px 12px}#attach:disabled{opacity:.5}.thumb{max-width:240px;max-height:220px;border-radius:12px;display:block;margin:0 0 8px}.preview{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:13px;color:#ccc}.preview img{width:52px;height:52px;object-fit:cover;border-radius:8px}form{background:#303030;border:1px solid #484848;border-radius:18px;display:flex;align-items:end;gap:10px;padding:12px}textarea{flex:1;background:transparent;color:#fff;border:0;outline:0;resize:none;min-height:32px;max-height:160px;font:inherit;padding:7px}#send{border:0;border-radius:10px;background:#e7e7e7;color:#111;padding:10px 16px;font-weight:700}#send:disabled{opacity:.45;cursor:wait}.hint{text-align:center;color:#888;font-size:12px;margin-top:9px}.footer{font-size:12px;color:#888;padding:0 8px 8px}@media(max-width:650px){aside{width:155px;padding:10px 6px}.top{padding:15px}.composer{padding:10px}#messages{padding:20px 12px}.welcome{font-size:21px}}
</style></head><body><aside><div style="font-size:19px;font-weight:750;padding:8px">✦ JARVIS</div><button id="new">＋ New Chat</button><div id="history"></div><div class="footer">Text + Photo · Local Ollama<br>Chats saved in this browser</div></aside><main><div class="top">JARVIS 6.1 <span style="color:#999;font-size:13px;font-weight:400"> · qwen3:1.7b / moondream</span></div><div id="messages"></div><div class="composer"><div id="preview" class="preview" hidden></div><form id="form"><input id="photo" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="attach" type="button" title="Attach photo">＋ Photo</button><textarea id="prompt" rows="1" placeholder="Message JARVIS..." aria-label="Your message"></textarea><button id="send" type="submit">Send</button></form><div class="hint">Enter to send · Shift+Enter for new line · AI can make mistakes</div></div></main><script>
const KEY='jarvis6_chats_v1';let chats=[];try{chats=JSON.parse(localStorage.getItem(KEY))||[]}catch{}if(!Array.isArray(chats))chats=[];let active=chats[0]?.id||null;const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){console.warn('Browser storage full; chat not saved',e)}};function current(){return chats.find(c=>c.id===active)}function newChat(){let c={id:Date.now().toString()+Math.random().toString(36).slice(2),title:'New Chat',messages:[]};chats.unshift(c);active=c.id;save();render();$('prompt').focus()}function render(){let h=$('history');h.replaceChildren();for(let c of chats){let b=document.createElement('button');b.className='chat'+(c.id===active?' active':'');b.textContent=c.title;b.title=c.title;b.onclick=()=>{active=c.id;render()};h.appendChild(b)}let box=$('messages');box.replaceChildren();let c=current();if(!c||!c.messages.length){let w=document.createElement('div');w.className='welcome';w.textContent='What can I help you with?';box.appendChild(w)}else for(let m of c.messages){let d=document.createElement('div');d.className='message '+m.role;if(m.role==='assistant'){let label=document.createElement('div');label.className='label';label.textContent='✦ JARVIS';d.appendChild(label)}let body=document.createElement('div');body.textContent=m.content; if(m.image){let img=document.createElement('img');img.className='thumb';img.src=m.image;d.appendChild(img)}d.appendChild(body);box.appendChild(d)}box.scrollTop=box.scrollHeight}let busy=false;let selectedImage=null;
$('attach').onclick=()=>$('photo').click();
$('photo').onchange=async()=>{const file=$('photo').files[0];if(!file)return; if(file.size>8*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('JPG, PNG, WEBP only; max 8 MB');$('photo').value='';return;}const reader=new FileReader();reader.onload=()=>{selectedImage=String(reader.result);const preview=$('preview');preview.replaceChildren();const im=document.createElement('img');im.src=selectedImage;preview.append(im,document.createTextNode(file.name+' '));const rm=document.createElement('button');rm.type='button';rm.textContent='Remove';rm.onclick=()=>{selectedImage=null;$('photo').value='';preview.hidden=true;preview.replaceChildren()};preview.append(rm);preview.hidden=false};reader.readAsDataURL(file)};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;let text=$('prompt').value.trim();if(!text&&!selectedImage)return;if(!current())newChat();let c=current();const photo=selectedImage;const item={role:'user',content:text||'Describe this image.'};if(photo)item.image=photo;c.messages.push(item);selectedImage=null;$('photo').value='';$('preview').hidden=true;$('preview').replaceChildren();if(c.messages.length===1)c.title=text.slice(0,42);$('prompt').value='';busy=true;$('send').disabled=true;save();render();try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.messages.slice(-30).map(m=>({role:m.role,content:m.content,...(m.image?{images:[m.image.split(',')[1]]}:{})}))})});let j=await r.json();c.messages.push({role:'assistant',content:r.ok?j.answer:'Error: '+(j.error||r.status)})}catch(err){c.messages.push({role:'assistant',content:'Connection error: '+err.message})}finally{busy=false;$('send').disabled=false;save();render();$('prompt').focus()}};$('new').onclick=newChat;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};render();
</script></body></html>
